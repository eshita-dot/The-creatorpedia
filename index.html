function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakRadio });
</script>

const PIPELINE_STEPS = [
  { id: 'search',  label: 'Searching Public Data',       sublabel: 'Cross-referencing 14 platform APIs' },
  { id: 'analyze', label: 'Analyzing Format & Platform', sublabel: 'Reels, posts, long-form, Stories, Shorts' },
  { id: 'bucket',  label: 'Bucketing Campaign Types',    sublabel: 'Paid · Gifted · Barter · Ambassador · Affiliate' },
  { id: 'index',   label: 'Generating Creator Index',    sublabel: 'Building collaboration graph' },
];

function Processing({ query, onComplete }) {
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const timings = [700, 1200, 900, 1000];
    let t = 0;
    const timeouts = timings.map((delay, i) => {
      t += delay;
      return setTimeout(() => setStep(i + 1), t);
    });
    const finalTimeout = setTimeout(() => { setDone(true); setTimeout(onComplete, 400); }, t + 400);
    return () => { timeouts.forEach(clearTimeout); clearTimeout(finalTimeout); };
  }, []);

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 200,
      background: 'rgba(12, 16, 28, 0.72)', backdropFilter: 'blur(4px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div style={{
        background: 'var(--surface)', border: '1px solid var(--border-strong)',
        padding: '48px 52px', width: '520px', maxWidth: '90vw',
      }}>
        <div style={{
          fontFamily: 'var(--mono)', fontSize: '10px', letterSpacing: '0.14em',
          color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: '10px',
        }}>
          DEEP SCAN IN PROGRESS
        </div>
        <div style={{
          fontFamily: 'var(--serif)', fontSize: '20px', fontWeight: 600,
          color: 'var(--text-primary)', marginBottom: '8px', letterSpacing: '-0.01em',
        }}>
          Processing your query
        </div>
        <div style={{
          fontFamily: 'var(--mono)', fontSize: '12px', color: 'var(--accent)',
          marginBottom: '36px', letterSpacing: '0.02em',
        }}>
          "{query}"
        </div>

        <div style={{ display: 'flex', flexDirection: 'column' }}>
          {PIPELINE_STEPS.map((s, i) => {
            const isActive = step === i;
            const isComplete = step > i;
            return (
              <div key={s.id} style={{
                display: 'flex', alignItems: 'flex-start', gap: '16px',
                padding: '14px 0',
                borderBottom: i < PIPELINE_STEPS.length - 1 ? '1px solid var(--border)' : 'none',
                opacity: step < i ? 0.3 : 1, transition: 'opacity 0.4s',
              }}>
                <div style={{ marginTop: '2px', flexShrink: 0 }}>
                  {isComplete ? (
                    <div style={{
                      width: '18px', height: '18px', border: '1.5px solid var(--accent)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
                        <polyline points="1,4 4,7 9,1" stroke="var(--accent)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </div>
                  ) : isActive ? (
                    <PulseDot />
                  ) : (
                    <div style={{ width: '18px', height: '18px', border: '1.5px solid var(--border-strong)' }} />
                  )}
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{
                    fontFamily: 'var(--sans)', fontSize: '14px', fontWeight: 500,
                    color: isComplete || isActive ? 'var(--text-primary)' : 'var(--text-muted)',
                    marginBottom: '3px',
                  }}>
                    {s.label}
                  </div>
                  <div style={{
                    fontFamily: 'var(--mono)', fontSize: '11px',
                    color: isActive ? 'var(--accent)' : 'var(--text-muted)',
                    letterSpacing: '0.02em',
                  }}>
                    {s.sublabel}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {done && (
          <div style={{
            marginTop: '24px', padding: '12px 20px',
            background: 'oklch(95% 0.04 155)', border: '1px solid oklch(75% 0.1 155)',
            display: 'flex', alignItems: 'center', gap: '10px',
          }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="6" fill="oklch(45% 0.15 155)"/>
              <polyline points="4,7 6.5,9.5 10,4.5" stroke="white" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <span style={{
              fontFamily: 'var(--mono)', fontSize: '11px',
              color: 'oklch(30% 0.12 155)', letterSpacing: '0.04em',
            }}>
              347 CREATOR RECORDS FOUND — LOADING RESULTS
            </span>
          </div>
        )}
      </div>
    </div>
  );
}

function PulseDot() {
  return (
    <div style={{
      width: '18px', height: '18px',
      display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative',
    }}>
      <style>{`
        @keyframes pulse-ring { 0% { transform:scale(0.6); opacity:1; } 100% { transform:scale(1.4); opacity:0; } }
        @keyframes pulse-core { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .pulse-ring { position:absolute; width:14px; height:14px; border:1.5px solid var(--accent); border-radius:50%; animation:pulse-ring 1s ease-out infinite; }
        .pulse-core { width:6px; height:6px; background:var(--accent); border-radius:50%; animation:pulse-core 1s ease-in-out infinite; }

function CollapsibleCard({ title, count, isOpen, onToggle, children }) {
  return (
    <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', overflow: 'hidden' }}>
      <div
        onClick={onToggle}
        style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '18px 24px', cursor: 'pointer',
          borderBottom: isOpen ? '1px solid var(--border)' : 'none',
          background: isOpen ? 'var(--surface)' : 'oklch(98.5% 0.003 240)',
        }}
      >
        <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
          <span style={{ fontFamily: 'var(--sans)', fontSize: '15px', fontWeight: 600, color: 'var(--text-primary)' }}>
            {title}
          </span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: '11px', color: 'var(--text-muted)', letterSpacing: '0.06em' }}>
            {count}
          </span>
        </div>
        <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
          <button
            title="Download CSV"
            onClick={e => e.stopPropagation()}
            style={{
              background: 'none', border: '1px solid var(--border)', padding: '5px 8px',
              cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '5px',
              fontFamily: 'var(--sans)', fontSize: '11px', color: 'var(--text-muted)',
            }}
          >
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
              <path d="M5.5 1v6M3 5.5l2.5 2.5 2.5-2.5M2 10h7" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            CSV
          </button>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
               style={{ transform: isOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}>
            <polyline points="2,5 7,9 12,5" stroke="var(--text-muted)" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
      </div>
      {isOpen && (
        <div style={{ padding: '0 24px 20px' }}>
          {children}
        </div>
      )}
    </div>
  );
}

// ── App Root ───────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('landing');
  const [query, setQuery] = useState('');

  useEffect(() => {
    const hue = tweaks.accentHue;
    document.documentElement.style.setProperty('--accent',       `oklch(32% 0.13 ${hue})`);
    document.documentElement.style.setProperty('--accent-mid',   `oklch(40% 0.12 ${hue})`);
    document.documentElement.style.setProperty('--accent-light', `oklch(94% 0.04 ${hue})`);
  }, [tweaks.accentHue]);

  const handleSearch = (q) => {
    setQuery(q);
    setScreen('processing');
  };

  return (
    <div>
      <TopNav onLogoClick={() => setScreen('landing')} />

      {screen === 'landing' && <Landing onSearch={handleSearch} tweaks={tweaks} />}
      {(screen === 'processing' || screen === 'profile') && <CreatorProfile tweaks={tweaks} />}
      {screen === 'processing' && <Processing query={query} onComplete={() => setScreen('profile')} />}

      <TweaksPanel>
        <TweakSection label="Accent Color" />
        <TweakRadio
          label="Palette"
          options={['Deep Navy', 'Emerald', 'Burgundy', 'Slate']}
          value={tweaks.accentLabel}
          onChange={v => {
            const map = { 'Deep Navy': 255, 'Emerald': 155, 'Burgundy': 15, 'Slate': 240 };
            setTweak({ accentLabel: v, accentHue: map[v] });
          }}
        />
        <TweakSection label="Heading Font" />
        <TweakRadio
          label="Font"
          options={['Playfair Display', 'Georgia', 'Times New Roman']}
          value={tweaks.fontHeading}
          onChange={v => setTweak('fontHeading', v)}
        />
        <TweakSection label="Density" />
        <TweakRadio
          label="Layout"
          options={['comfortable', 'compact']}
          value={tweaks.density}
          onChange={v => setTweak('density', v)}
        />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
