<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Creatorpedia - Influencer Intelligence Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; color: #333; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; background: white; border-bottom: 1px solid #e8e8e8; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: #000; }
        .nav-links { display: flex; gap: 40px; align-items: center; }
        .nav-links a { text-decoration: none; color: #666; transition: color 0.3s; }
        .nav-links a:hover { color: #000; }
        .login-btn { background: #003087; color: white !important; padding: 10px 30px; border-radius: 4px; }
        .hero { text-align: center; padding: 80px 20px 60px; max-width: 1200px; margin: 0 auto; }
        .subtitle { font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: #999; margin-bottom: 30px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 5rem; font-weight: 400; margin-bottom: 20px; }
        .tagline { font-size: 1.1rem; color: #666; margin-bottom: 60px; }
        .search-container { max-width: 900px; margin: 0 auto; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 40px; }
        .tabs { display: flex; border-bottom: 2px solid #e8e8e8; margin-bottom: 30px; }
        .tab { flex: 1; text-align: center; padding: 15px; background: none; border: none; font-size: 0.9rem; font-weight: 600; color: #999; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; position: relative; }
        .tab.active { color: #003087; }
        .tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: #003087; }
        .search-box { display: flex; gap: 15px; margin-bottom: 30px; }
        .search-input-wrapper { flex: 1; position: relative; }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; }
        .search-input { width: 100%; padding: 18px 20px 18px 55px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        .search-input:focus { outline: none; border-color: #003087; }
        .search-btn { background: #003087; color: white; border: none; padding: 18px 50px; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .search-btn:hover { background: #002366; }
        .try-section { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .try-tag { background: white; border: 1px solid #ddd; padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; color: #666; cursor: pointer; }
        .try-tag:hover { border-color: #003087; color: #003087; }
        .results-section { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: none; }
        .results-section.active { display: block; }
        .loading { text-align: center; padding: 60px; font-size: 1.2rem; color: #666; }
        .influencer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-top: 30px; }
        .influencer-card { background: white; border: 1px solid #e8e8e8; border-radius: 8px; padding: 30px; transition: transform 0.3s, box-shadow 0.3s; }
        .influencer-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .influencer-name { font-size: 1.3rem; font-weight: 600; margin-bottom: 5px; }
        .influencer-handle { color: #003087; text-decoration: none; margin-bottom: 15px; display: inline-block; }
        .influencer-stats { display: flex; gap: 20px; margin: 15px 0; padding: 15px 0; border-top: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; }
        .stat { flex: 1; }
        .stat-label { font-size: 0.75rem; color: #999; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.1rem; font-weight: 600; color: #333; }
        .influencer-category { display: inline-block; background: #f0f0f0; padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; margin-top: 10px; }
        @media (max-width: 768px) { h1 { font-size: 3rem; } .search-box { flex-direction: column; } nav { padding: 20px 30px; } }
    </style>
</head>
<body>
    <nav>
        <div class="logo">The Creatorpedia</div>
        <div class="nav-links">
            <a href="#pricing">Pricing</a>
            <a href="#about">About</a>
            <a href="#login" class="login-btn">Login</a>
        </div>
    </nav>

    <section class="hero">
        <p class="subtitle">INFLUENCER INTELLIGENCE DATABASE · V2.1</p>
        <h1>The Creatorpedia</h1>
        <p class="tagline">The searchable database of influencer–brand collaborations.</p>

        <div class="search-container">
            <div class="tabs">
                <button class="tab active">Search by Creator</button>
                <button class="tab">Search by Brand</button>
            </div>

            <div class="search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="e.g. beauty influencers in Delhi NCR with 50K+ followers">
                </div>
                <button class="search-btn" onclick="performSearch()">Search</button>
            </div>

            <div class="try-section">
                <span style="color: #666; font-size: 0.95rem;">Try:</span>
                <span class="try-tag" onclick="fillSearch('beauty')">beauty</span>
                <span class="try-tag" onclick="fillSearch('fashion')">fashion</span>
                <span class="try-tag" onclick="fillSearch('tech')">tech</span>
                <span class="try-tag" onclick="fillSearch('food')">food</span>
                <span class="try-tag" onclick="fillSearch('fitness')">fitness</span>
            </div>
        </div>
    </section>

    <section class="results-section" id="resultsSection">
        <div class="loading" id="loading">Searching database...</div>
        <div id="resultsCount" style="font-size: 1.2rem; color: #666; margin-bottom: 20px;"></div>
        <div class="influencer-grid" id="influencerGrid"></div>
    </section>

    <script>
        const SHEET_ID = '1-b42-16e9g2kouyW3BIYxRZ0Bo90K1s6zLoYtD3mY_k';
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json';

        let allInfluencers = [];

        async function loadInfluencers() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const rows = json.table.rows;
                allInfluencers = rows.map(row => ({
                    name: row.c[0]?.v || '',
                    handle: row.c[1]?.v || '',
                    followers: row.c[2]?.v || 0,
                    category: row.c[3]?.v || '',
                    location: row.c[4]?.v || '',
                    language: row.c[5]?.v || '',
                    brands: row.c[6]?.v || '',
                    profileLink: row.c[12]?.v || ''
                }));
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function fillSearch(query) {
            document.getElementById('searchInput').value = query;
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) { alert('Please enter a search term'); return; }

            document.getElementById('resultsSection').classList.add('active');
            document.getElementById('loading').style.display = 'block';
            document.getElementById('influencerGrid').style.display = 'none';

            if (allInfluencers.length === 0) await loadInfluencers();

            setTimeout(() => {
                const results = allInfluencers.filter(inf =>
                    inf.name.toLowerCase().includes(query) ||
                    inf.handle.toLowerCase().includes(query) ||
                    inf.category.toLowerCase().includes(query) ||
                    inf.location.toLowerCase().includes(query) ||
                    inf.brands.toLowerCase().includes(query)
                );
                displayResults(results);
            }, 500);
        }

        function displayResults(results) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('influencerGrid').style.display = 'grid';
            document.getElementById('resultsCount').textContent = 'Found ' + results.length + ' influencers';

            const grid = document.getElementById('influencerGrid');
            if (results.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 60px;">No influencers found. Try a different search term.</p>';
                return;
            }

            grid.innerHTML = results.map(inf => `
                <div class="influencer-card">
                    <div class="influencer-name">${inf.name}</div>
                    <a href="${inf.profileLink}" target="_blank" class="influencer-handle">${inf.handle}</a>
                    <div class="influencer-stats">
                        <div class="stat">
                            <div class="stat-label">Followers</div>
                            <div class="stat-value">${formatNumber(inf.followers)}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Location</div>
                            <div class="stat-value">${inf.location}</div>
                        </div>
                    </div>
                    <div class="influencer-category">${inf.category}</div>
                </div>
            `).join('');
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        window.addEventListener('load', loadInfluencers);
    </script>
</body>
</html>
